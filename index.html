<style>
  :root{
    --bg: #0f1115;
    --panel: #191c23;
    --panel-alt: #21252e;
    --line: #333947;
    --line-soft: #262a33;
    --text: #ece9e2;
    --text-dim: #9aa1ac;
    --accent: #22d3ee;
    --accent-glow: rgba(34, 211, 238, 0.15);
    --warn: #fb7185;
    --warn-bg: rgba(251, 113, 133, 0.1);
    --ok: #34d399;
    --ok-bg: rgba(52, 211, 153, 0.1);
    --gold: #f59e0b;
    --font-heading: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo { font-family: var(--font-heading); font-weight: 700; font-size: 1.25rem; }
  .logo span { color: var(--accent); }
  .badge { background: var(--accent-glow); color: var(--accent); padding: 2px 8px; border-radius: 4px; font-size: 11px; font-family: var(--font-mono); margin-left: 8px; border: 1px solid rgba(34, 211, 238, 0.3); }

  .layout {
    display: grid;
    grid-template-columns: 320px 1fr 340px;
    flex: 1;
    height: calc(100vh - 61px);
    overflow: hidden;
  }

  .col { display: flex; flex-direction: column; border-right: 1px solid var(--line); overflow: hidden; }
  .col:last-child { border-right: none; }
  
  .col-header {
    padding: 1rem;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .col-title { font-family: var(--font-heading); font-size: 1rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

  /* Left Panel: Categories */
  .category-list { overflow-y: auto; padding: 0.75rem; display: flex; flex-direction: column; gap: 0.5rem; }
  .cat-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0.85rem 1rem;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .cat-card:hover { border-color: var(--accent); background: var(--panel-alt); }
  .cat-card.active { border-color: var(--accent); background: var(--accent-glow); }
  .cat-info { display: flex; align-items: center; gap: 0.75rem; }
  .cat-icon { font-size: 1.2rem; width: 24px; text-align: center; }
  .cat-name { font-weight: 600; font-size: 0.9rem; }
  .cat-count { font-size: 11px; color: var(--text-dim); font-family: var(--font-mono); }
  .cat-selection { font-size: 11px; color: var(--accent); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }

  /* Middle Panel: Hardware Store Catalog */
  .store-panel { display: flex; flex-direction: column; height: 100%; background: #13161c; }
  .store-controls { padding: 1rem; border-bottom: 1px solid var(--line); display: flex; gap: 0.75rem; background: var(--panel); }
  .search-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 0.5rem 0.85rem;
    border-radius: 4px;
    font-size: 13px;
    outline: none;
  }
  .search-input:focus { border-color: var(--accent); }
  .filter-toggle {
    background: var(--panel-alt);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 0.5rem 0.85rem;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .filter-toggle.active { border-color: var(--ok); color: var(--ok); background: var(--ok-bg); }

  .store-items { overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
  .item-card {
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-radius: 6px;
    padding: 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: border 0.15s;
  }
  .item-card:hover { border-color: var(--line); }
  .item-left { display: flex; gap: 1rem; align-items: center; }
  .item-img { width: 48px; height: 48px; background: var(--bg); border-radius: 4px; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
  .item-details { display: flex; flex-direction: column; gap: 4px; }
  .item-title { font-weight: 600; font-size: 0.95rem; }
  .item-specs { font-size: 12px; color: var(--text-dim); display: flex; gap: 8px; font-family: var(--font-mono); }
  .item-spec-tag { background: var(--panel-alt); padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line-soft); }

  .item-right { display: flex; align-items: center; gap: 1rem; }
  .item-price { font-family: var(--font-mono); font-weight: 600; font-size: 1rem; color: var(--text); }
  .btn-select {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 0.4rem 0.85rem;
    border-radius: 4px;
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-select:hover { opacity: 0.9; }
  .btn-select.selected { background: var(--ok); color: #000; }

  /* Right Panel: Build Summary & Checks */
  .summary-body { overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; flex: 1; }
  .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .metric-card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 0.75rem; }
  .metric-label { font-size: 11px; color: var(--text-dim); font-family: var(--font-mono); margin-bottom: 4px; }
  .metric-val { font-family: var(--font-heading); font-size: 1.25rem; font-weight: 700; }

  .compat-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 0.85rem; }
  .compat-header { font-family: var(--font-heading); font-weight: 600; margin-bottom: 0.5rem; font-size: 0.85rem; text-transform: uppercase; color: var(--text-dim); }
  .compat-list { display: flex; flex-direction: column; gap: 0.5rem; }
  .compat-item { font-size: 12px; padding: 0.5rem; border-radius: 4px; display: flex; gap: 0.5rem; align-items: flex-start; }
  .compat-item.ok { background: var(--ok-bg); color: var(--ok); border: 1px solid rgba(52, 211, 153, 0.2); }
  .compat-item.warn { background: var(--warn-bg); color: var(--warn); border: 1px solid rgba(251, 113, 133, 0.2); }

  .build-items { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.5rem; }
  .build-item-row { display: flex; justify-content: space-between; font-size: 12px; background: var(--panel-alt); padding: 6px 8px; border-radius: 4px; border: 1px solid var(--line-soft); }
  .build-item-name { text-overflow: ellipsis; overflow: hidden; white-space: nowrap; max-width: 180px; }
  .build-item-remove { color: var(--warn); cursor: pointer; margin-left: 6px; }

  .summary-footer { padding: 1rem; border-top: 1px solid var(--line); background: var(--panel); }
  .btn-export { width: 100%; background: var(--panel-alt); border: 1px solid var(--line); color: var(--text); padding: 0.65rem; border-radius: 4px; font-weight: 600; cursor: pointer; text-align: center; font-size: 13px; }
  .btn-export:hover { border-color: var(--accent); color: var(--accent); }
</style>

// Auto-Expander: Generates exactly 50 realistic items per category using brand & model variants
function generate50PerCategory() {
  const categories = {};
  const brands = ["ASUS", "MSI", "Gigabyte", "Corsair", "G.Skill", "Thermaltake", "DeepCool", "ASRock", "Zotac", "XFX"];
  
  Object.keys(RAW_TEMPLATES).forEach(catKey => {
    const rawList = RAW_TEMPLATES[catKey];
    const full50List = [];
    let idCount = 1;

    // First push the authentic bases
    rawList.forEach(item => {
      full50List.push({ ...item, id: `${catKey}_${idCount++}` });
    });

    // Expand remaining to reach exactly 50 items per category
    let brandIdx = 0;
    while (full50List.length < 50) {
      const baseItem = rawList[full50List.length % rawList.length];
      const brand = brands[brandIdx % brands.length];
      const priceOffset = (full50List.length % 7) * 5 - 15;
      
      const newName = `${brand} ${baseItem.n.replace(/(ASUS|MSI|Gigabyte|G\.Skill|Corsair|Sapphire|PowerColor|XFX|ASRock)\s*/g, '')} Edition ${Math.floor(full50List.length / rawList.length) + 1}`;
      
      const newItem = {
        ...baseItem,
        id: `${catKey}_${idCount++}`,
        n: newName,
        p: Math.max(25, baseItem.p + priceOffset),
      };
      full50List.push(newItem);
      brandIdx++;
    }

    categories[catKey] = full50List;
  });

  return categories;
}

const CATEGORY_DEFS = [
  { id: 'cpu', name: 'Processor (CPU)', icon: '💻' },
  { id: 'board', name: 'Motherboard', icon: '🔌' },
  { id: 'ram', name: 'Memory (RAM)', icon: '⚡' },
  { id: 'gpu', name: 'Graphics Card', icon: '🎮' },
  { id: 'storage', name: 'Storage (SSD/HDD)', icon: '💾', multi: true },
  { id: 'psu', name: 'Power Supply (PSU)', icon: '⚡' },
  { id: 'case', name: 'PC Case', icon: '📦' },
  { id: 'cooler', name: 'CPU Cooler', icon: '❄️' }
];

const FULL_STORE_DATA = generate50PerCategory();

// App State
let activeCatId = 'cpu';
let selectedParts = {}; // catId -> item OR array of items for storage
let filterCompatOnly = false;

// Initialize App
function init() {
  renderCategories();
  renderStoreItems();
  updateSummary();
}

function renderCategories() {
  const container = document.getElementById('category-list');
  container.innerHTML = CATEGORY_DEFS.map(cat => {
    const items = FULL_STORE_DATA[cat.id] || [];
    const selection = selectedParts[cat.id];
    let selText = "None selected";
    
    if (selection) {
      if (Array.isArray(selection)) {
        selText = selection.length > 0 ? `${selection.length} drive(s)` : "None selected";
      } else {
        selText = selection.n;
      }
    }

    return `
      <div class="cat-card ${cat.id === activeCatId ? 'active' : ''}" onclick="selectCategory('${cat.id}')">
        <div class="cat-info">
          <span class="cat-icon">${cat.icon}</span>
          <div>
            <div class="cat-name">${cat.name}</div>
            <div class="cat-selection">${selText}</div>
          </div>
        </div>
        <div class="cat-count">${items.length}</div>
      </div>
    `;
  }).join('');
}

function selectCategory(catId) {
  activeCatId = catId;
  renderCategories();
  renderStoreItems();
}

function toggleCompatFilter() {
  filterCompatOnly = !filterCompatOnly;
  const btn = document.getElementById('filter-compat-btn');
  btn.classList.toggle('active', filterCompatOnly);
  renderStoreItems();
}

function isItemCompatible(item, catId) {
  const cpu = selectedParts['cpu'];
  const board = selectedParts['board'];
  const psu = selectedParts['psu'];
  const gpu = selectedParts['gpu'];

  // Socket Check (CPU vs Board)
  if (catId === 'board' && cpu && item.s !== cpu.s) return false;
  if (catId === 'cpu' && board && item.s !== board.s) return false;

  // RAM Type Check (RAM vs Board)
  if (catId === 'ram' && board && item.r !== board.r) return false;
  if (catId === 'board' && selectedParts['ram'] && item.r !== selectedParts['ram'].r) return false;

  // Power PSU Check
  if (catId === 'psu') {
    const estWatts = calculateTotalWattage();
    if (item.w < estWatts) return false;
  }

  return true;
}

function renderStoreItems() {
  const container = document.getElementById('store-items');
  const searchQuery = document.getElementById('search-input').value.toLowerCase();
  const rawItems = FULL_STORE_DATA[activeCatId] || [];

  const filtered = rawItems.filter(item => {
    const matchesSearch = item.n.toLowerCase().includes(searchQuery) || 
                          (item.tags && item.tags.some(t => t.toLowerCase().includes(searchQuery)));
    if (!matchesSearch) return false;
    if (filterCompatOnly && !isItemCompatible(item, activeCatId)) return false;
    return true;
  });

  if (filtered.length === 0) {
    container.innerHTML = `<div style="text-align:center; padding: 2rem; color:var(--text-dim);">No components found.</div>`;
    return;
  }

  const currentSelection = selectedParts[activeCatId];

  container.innerHTML = filtered.map(item => {
    let isSelected = false;
    if (Array.isArray(currentSelection)) {
      isSelected = currentSelection.some(s => s.id === item.id);
    } else if (currentSelection) {
      isSelected = currentSelection.id === item.id;
    }

    const isCompat = isItemCompatible(item, activeCatId);

    return `
      <div class="item-card" style="${!isCompat ? 'opacity:0.65;' : ''}">
        <div class="item-left">
          <div class="item-img">${CATEGORY_DEFS.find(c => c.id === activeCatId).icon}</div>
          <div class="item-details">
            <div class="item-title">${item.n} ${!isCompat ? '<span style="color:var(--warn); font-size:11px;">(Incompatible)</span>' : ''}</div>
            <div class="item-specs">
              ${item.s ? `<span class="item-spec-tag">Socket ${item.s}</span>` : ''}
              ${item.r ? `<span class="item-spec-tag">${item.r}</span>` : ''}
              ${item.w ? `<span class="item-spec-tag">${item.w}W</span>` : ''}
              ${item.tags ? item.tags.map(t => `<span class="item-spec-tag">${t}</span>`).join('') : ''}
            </div>
          </div>
        </div>
        <div class="item-right">
          <div class="item-price">$${item.p}</div>
          <button class="btn-select ${isSelected ? 'selected' : ''}" onclick="toggleSelect('${item.id}')">
            ${isSelected ? 'Added ✓' : 'Add +'}
          </button>
        </div>
      </div>
    `;
  }).join('');
}

function toggleSelect(itemId) {
  const catDef = CATEGORY_DEFS.find(c => c.id === activeCatId);
  const item = FULL_STORE_DATA[activeCatId].find(i => i.id === itemId);

  if (catDef.multi) {
    if (!selectedParts[activeCatId]) selectedParts[activeCatId] = [];
    const idx = selectedParts[activeCatId].findIndex(i => i.id === itemId);
    if (idx > -1) {
      selectedParts[activeCatId].splice(idx, 1);
    } else {
      selectedParts[activeCatId].push(item);
    }
  } else {
    if (selectedParts[activeCatId] && selectedParts[activeCatId].id === itemId) {
      delete selectedParts[activeCatId];
    } else {
      selectedParts[activeCatId] = item;
    }
  }

  renderCategories();
  renderStoreItems();
  updateSummary();
}

function removeItem(catId, itemId) {
  if (Array.isArray(selectedParts[catId])) {
    selectedParts[catId] = selectedParts[catId].filter(i => i.id !== itemId);
  } else {
    delete selectedParts[catId];
  }
  renderCategories();
  renderStoreItems();
  updateSummary();
}

function calculateTotalWattage() {
  let watts = 50; // System baseline / Fans
  if (selectedParts.cpu) watts += (selectedParts.cpu.w || 65);
  if (selectedParts.gpu) watts += (selectedParts.gpu.w || 200);
  if (selectedParts.cooler) watts += (selectedParts.cooler.w || 10);
  return watts;
}

function updateSummary() {
  // 1. Total Price
  let price = 0;
  Object.keys(selectedParts).forEach(catId => {
    const val = selectedParts[catId];
    if (Array.isArray(val)) {
      val.forEach(i => price += i.p);
    } else if (val) {
      price += val.p;
    }
  });
  document.getElementById('total-price').innerText = `$${price.toLocaleString()}`;

  // 2. Total Wattage
  const totalWatts = calculateTotalWattage();
  document.getElementById('total-wattage').innerText = `${totalWatts}W`;

  // 3. Compatibility Checks
  const compatList = document.getElementById('compat-list');
  const checks = [];

  const cpu = selectedParts.cpu;
  const board = selectedParts.board;
  const ram = selectedParts.ram;
  const psu = selectedParts.psu;

  // CPU + Board Check
  if (cpu && board) {
    if (cpu.s === board.s) {
      checks.push({ ok: true, msg: `Socket matched: ${cpu.s}` });
    } else {
      checks.push({ ok: false, msg: `Socket mismatch: CPU (${cpu.s}) vs Board (${board.s})` });
    }
  } else {
    checks.push({ ok: true, msg: "CPU & Motherboard socket auto-check ready" });
  }

  // Board + RAM Check
  if (board && ram) {
    if (board.r === ram.r) {
      checks.push({ ok: true, msg: `Memory type matched: ${ram.r}` });
    } else {
      checks.push({ ok: false, msg: `RAM mismatch: Board requires ${board.r}, got ${ram.r}` });
    }
  }

  // PSU Check
  if (psu) {
    if (psu.w >= totalWatts + 100) {
      checks.push({ ok: true, msg: `PSU Headroom safe: ${psu.w}W vs ${totalWatts}W load` });
    } else if (psu.w >= totalWatts) {
      checks.push({ ok: false, msg: `PSU tight headroom: ${psu.w}W vs ${totalWatts}W load` });
    } else {
      checks.push({ ok: false, msg: `Insufficient PSU: Build requires at least ${totalWatts}W!` });
    }
  }

  compatList.innerHTML = checks.map(c => `
    <div class="compat-item ${c.ok ? 'ok' : 'warn'}">
      <span>${c.ok ? '✓' : '⚠️'}</span>
      <span>${c.msg}</span>
    </div>
  `).join('');

  // 4. Selected Parts List
  const buildItems = document.getElementById('build-items');
  let buildHtml = '';

  CATEGORY_DEFS.forEach(cat => {
    const val = selectedParts[cat.id];
    if (!val) return;

    if (Array.isArray(val)) {
      val.forEach(i => {
        buildHtml += `
          <div class="build-item-row">
            <span class="build-item-name">${i.n}</span>
            <div>
              <span>$${i.p}</span>
              <span class="build-item-remove" onclick="removeItem('${cat.id}', '${i.id}')">✕</span>
            </div>
          </div>
        `;
      });
    } else {
      buildHtml += `
        <div class="build-item-row">
          <span class="build-item-name">${val.n}</span>
          <div>
            <span>$${val.p}</span>
            <span class="build-item-remove" onclick="removeItem('${cat.id}', '${val.id}')">✕</span>
          </div>
        </div>
      `;
    }
  });

  buildItems.innerHTML = buildHtml || `<div style="font-size:12px; color:var(--text-dim); text-align:center; padding: 1rem;">No components added yet.</div>`;
}

function exportBuild() {
  const summary = [];
  CATEGORY_DEFS.forEach(cat => {
    const val = selectedParts[cat.id];
    if (val) {
      if (Array.isArray(val)) {
        val.forEach(i => summary.push(`${cat.name}: ${i.n} ($${i.p})`));
      } else {
        summary.push(`${cat.name}: ${val.n} ($${val.p})`);
      }
    }
  });

  if (summary.length === 0) {
    alert("Your build is currently empty!");
    return;
  }

  const text = `=== BUILDRIG PC CONFIGURATION ===\n\n` + summary.join('\n') + `\n\nEstimated Wattage: ${calculateTotalWattage()}W\nTotal Price: ${document.getElementById('total-price').innerText}`;
  navigator.clipboard.writeText(text);
  alert("Build configuration copied to clipboard!");
}

// Start application
window.onload = init;
</script>
</body>
</html>
